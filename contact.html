<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Trishitha Gundla</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: rgb(19, 19, 19);
            color: rgb(242, 243, 244);
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        header {
            height: 70px;
            width: 100%;
            background-color: rgb(4, 5, 7);
            display: flex;
            align-items: center;
        }

        .title {
            font-size: 35px;
            padding-left: 80px;
            color: rgb(242, 243, 244);
            font-family: fantasy;
            margin-left: 40px;
        }

        .title p {
            margin: 0;
        }

        .navbar {
            margin-left: auto;
            margin-right: 35px;
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: rgb(242, 243, 243);
            text-decoration: none;
            font-size: 21px;
            padding: 20px 35px;
        }

        .navbar a:hover {
            color: rgb(160, 160, 160);
            transition: 0.3s;
        }

        .contact-page {
            min-height: calc(100vh - 70px);
            padding: 65px 70px 80px;
        }

        .contact-page > h1 {
            color: rgb(234, 227, 227);
            text-align: center;
            font-size: 60px;
            margin: 0 0 50px;
        }

        .contact-container {
            width: min(1200px, 90%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .contact-card {
            min-height: 260px;
            background-color: transparent;
            border: 0.5px solid rgb(242, 243, 244);
            border-radius: 10px;
            color: rgb(242, 243, 244);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            transition: 0.3s;
        }

        .contact-card:hover {
            transform: translateY(-8px);
            box-shadow: 0px 1px 4px 1px rgb(242, 243, 244);
        }

        .contact-card > i {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .contact-card h2 {
            font-size: 30px;
            margin: 5px 0 10px;
        }

        .contact-card p {
            font-size: 18px;
            margin: 5px 0 15px;
        }

        .contact-card a {
            color: rgb(242, 243, 244);
            text-decoration: none;
            font-size: 18px;
            border: 0.5px solid rgb(242, 243, 244);
            border-radius: 10px;
            padding: 9px 18px;
        }

        .contact-card a:hover {
            box-shadow: 0px 1px 2px 1px rgb(242, 243, 244);
        }

        .back-home {
            text-align: center;
            margin-top: 45px;
        }

        .back-home a {
            color: rgb(242, 243, 244);
            text-decoration: none;
            font-size: 20px;
            border: 0.5px solid rgb(242, 243, 244);
            border-radius: 10px;
            padding: 10px 20px;
        }

        .back-home a:hover {
            box-shadow: 0px 1px 2px 1px rgb(242, 243, 244);
        }

        @media (max-width: 900px) {
            .navbar a {
                padding: 20px 12px;
                font-size: 17px;
            }

            .title {
                padding-left: 15px;
                margin-left: 0;
                font-size: 30px;
            }

            .contact-page {
                padding: 45px 20px 60px;
            }

            .contact-page > h1 {
                font-size: 45px;
            }

            .contact-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="title">
            <p>Portfolio</p>
        </div>

        <div class="navbar">
            <a href="index.html#home">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#skills">Skills</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#resume">Resume</a>
            <a href="contact.html">Contact</a>
        </div>
    </header>

    <div class="contact-page">
        <h1>Contact Me</h1>

        <div class="contact-container">

            <div class="contact-card">
                <i class="fa-solid fa-envelope"></i>
                <h2>Email</h2>
                <p>trishithagundla@gmail.com</p>
                <a href="mailto:trishithagundla@gmail.com">Send Email</a>
            </div>

            <div class="contact-card">
                <i class="fa-solid fa-phone"></i>
                <h2>Phone</h2>
                <p>+91 6304697719</p>
                <a href="tel:+916304697719">Call Me</a>
            </div>

            <div class="contact-card">
                <i class="fa-brands fa-github"></i>
                <h2>GitHub</h2>
                <p>github.com/trishitha22</p>
                <a href="https://github.com/trishitha22"
                   target="_blank" rel="noopener noreferrer">Visit GitHub</a>
            </div>

            <div class="contact-card">
                <i class="fa-brands fa-linkedin"></i>
                <h2>LinkedIn</h2>
                <p>linkedin.com/in/trishitha-gundla</p>
                <a href="https://www.linkedin.com/in/trishitha-gundla"
                   target="_blank" rel="noopener noreferrer">Visit LinkedIn</a>
            </div>

        </div>

        <div class="back-home">
            <a href="index.html">← Back to Portfolio</a>
        </div>
    </div>

</body>
</html>
